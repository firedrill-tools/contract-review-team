[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contract-review-team"
version = "0.2.0"
readme = "README.md"
description = "LangGraph contract extraction, dual risk review and summary roles"
requires-python = ">=3.12"
dependencies = [
    "langgraph==1.2.15", "langchain-anthropic==1.7.6", "langchain-openai==1.7.2",
    "langchain-core==1.6.10", "langsmith==0.14.9", "anthropic==1.14.0",
    "openai==3.31.0", "httpx2==2.13.1", "pydantic==2.14.1",
]

[project.scripts]
contract-review = "contract_review.cli:main"
contract-review-cases = "contract_review.cases:main"
contract-review-state = "contract_review.managed_cli:main"

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/contract_review"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.sdist]
include = ["firedrill", "src", "fixtures", "scenarios", "tests", "scripts", ".github", "README.md", "AGENTS.md", "PLAN.md", "COMPATIBILITY.md", "pyproject.toml", "uv.lock", ".gitignore"]
