[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contract-review-team"
version = "0.1.0"
description = "LangGraph contract extraction, dual risk review and summary roles"
requires-python = ">=3.12"
dependencies = ["langgraph==1.2.15", "langchain-anthropic==1.7.6", "langchain-openai==1.7.2", "pydantic>=2.12,<3"]

[project.scripts]
contract-review = "contract_review.cli:main"
contract-review-state = "contract_review.managed_cli:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/contract_review"]

[tool.pytest.ini_options]
testpaths = ["tests"]
